server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Required for Google OAuth popup to postMessage credentials back.
        # "same-origin" (browser default) breaks the Google Sign-In popup flow
        # by severing the opener relationship. "same-origin-allow-popups" fixes this.
        add_header Cross-Origin-Opener-Policy "unsafe-none";
        add_header Cross-Origin-Embedder-Policy "unsafe-none";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
